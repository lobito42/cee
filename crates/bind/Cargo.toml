[package]
name = "cee-bind"
version = "0.0.1"
description = "Fassade über cee-graph für die Bindungen (NIF, WASM, PyO3): JSON und Bytes an der Grenze, einheitliche Fehler (ADR-029)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Nur für Prüfungen: `debug_panic()` löst absichtlich einen Panic aus (Abfangen an der Grenze).
test-hooks = []
# Beispiel-Fachpaket in dasselbe Artefakt übersetzen (offene Frage 2 im Proposal ap-40).
pkg-beispiel = ["dep:cee-pkg-beispiel"]

[dependencies]
# Lizenzen (ADR-034): cee-graph und cee-pkg-beispiel MPL-2.0, serde_json MIT/Apache-2.0
cee-graph = { path = "../graph" }
cee-pkg-beispiel = { path = "../pkg-beispiel", optional = true }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Automerge erzeugt zufällige Actor-IDs; in WASM kommt der Zufall aus der JS-Laufzeit (MIT).
automerge = { version = "0.12", features = ["wasm"] }

[dev-dependencies]
# Nur für das Prüfprogramm `bindctl` (MIT/Apache-2.0)
sha2 = "0.10"
base64 = "0.22"
