[package]
name = "datenmodell_wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "datenmodell_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
datenmodell = { path = "../.." }
serde_json.workspace = true
# Die Version von wasm-bindgen-cli muss exakt passen; build.sh liest sie aus Cargo.lock.
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Automerge erzeugt zufällige Actor-IDs; im Browser bzw. in Node kommt der Zufall aus der JS-Laufzeit.
automerge = { workspace = true, features = ["wasm"] }

[lints]
workspace = true
