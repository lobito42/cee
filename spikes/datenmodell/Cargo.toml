# Prototyp für den Datenmodell-Spike (ap-01). Kein Produktcode: wird nicht übernommen, dient als Beleg.
# Eigener Workspace, damit der Spike den Produkt-Workspace (crates/*) nicht berührt.
[workspace]
resolver = "2"
members = [".", "nif/native/datenmodell_nif", "wasm/crate"]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
# Aktuelle Linie (spaltenorientierter Op-Satz). Vergleich mit 0.5 und 0.7: examples/probe.rs und
# docs/spikes/datenmodell.md, Abschnitt Messwerte.
automerge = "0.12"
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "datenmodell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "datenmodell"
path = "src/lib.rs"

[[bin]]
name = "datenmodell"
path = "src/main.rs"

[dependencies]
automerge.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
# Nur für examples/probe.rs: Vergleich mit älteren Automerge-Linien (0.5: Op-Baum, 0.7: erster
# spaltenorientierter Op-Satz).
automerge_05 = { package = "automerge", version = "0.5" }
automerge_07 = { package = "automerge", version = "=0.7.4" }

[lints]
workspace = true

[profile.release]
debug = false
