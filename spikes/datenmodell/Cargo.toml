# Prototyp für den Datenmodell-Spike (ap-01). Kein Produktcode: wird nicht übernommen, dient als Beleg.
# Eigener Workspace, damit der Spike den Produkt-Workspace (crates/*) nicht berührt.
[workspace]
resolver = "2"
members = ["."]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
automerge = "0.7"
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "datenmodell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "datenmodell"
path = "src/lib.rs"

[[bin]]
name = "datenmodell"
path = "src/main.rs"

[dependencies]
automerge.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true

[profile.release]
debug = false
