[project]
name = "cee"
version = "0.0.1"
description = "Python-Teil: Geometrie-Worker (build123d/OpenCascade), Python-SDK und Harness-Werkzeuge"
requires-python = ">=3.11,<3.14"
license = "MPL-2.0"  # Worker; sdk/python erhält eigenes pyproject mit Apache-2.0 (ADR-034)
dependencies = ["cee-worker"]

[tool.uv.sources]
cee-worker = { workspace = true }

[project.optional-dependencies]
cad = [
    "build123d>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jsonschema>=4.23",
    "maturin>=1.9,<2",  # baut das Python-SDK sdk/python (PyO3), MIT/Apache-2.0
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["worker", "sdk/python"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["spikes", "server", "client", "crates", "target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# SIM117: `with feature(...)` umschließt bewusst eigene Builder-Kontexte (Script-Elemente)
ignore = ["SIM117"]
