[project]
name = "cadloop"
version = "0.0.1"
description = "KI-gestütztes Code-CAD für VS Code auf Basis von build123d/OpenCascade"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
cad = [
    "build123d>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = []  # packages/* werden in AP-01 ff. als Workspace-Mitglieder ergänzt

[tool.pytest.ini_options]
testpaths = ["tests/unit"]  # Abnahmetests gezielt: uv run pytest tests/acceptance/apxx
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# SIM117: `with feature(...)` umschließt bewusst eigene Builder-Kontexte (Code-Konvention, ADR-024)
ignore = ["SIM117"]
