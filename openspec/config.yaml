schema: spec-driven

context: |
  Language: de
  All artifacts must be written in de.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projekt: offene, kollaborative Plattform für Produktdefinition (CEE). Quelle der Wahrheit
  ist ein Element-Graph (ADR-028): jedes Element – vom Achsenursprung bis zur Baugruppe – hat dieselbe Form.
  Rust-Kern für das Datenmodell (crates/, ADR-029), Elixir/Phoenix-Server für Sync, Historie und Worker
  (server/, ADR-030), TypeScript-Client als Web- und Tauri-App (client/, ADR-031), Python-Worker mit
  OpenCascade für Geometrie (worker/, ADR-032). Lizenz: Kern MPL-2.0, sdk/ und format/ Apache-2.0 (ADR-034).
  Zielgruppe: Einzelpersonen, kleine und mittlere Unternehmen; perspektivisch eine offene Plattform wie
  Blender oder OpenSCAD, für Produktentwicklung in KMU. Der Kern ist fachneutral (ADR-046). Erster
  Anwendungsfall (nur zum produktiven Start): Raumgestaltung und Raumakustik für eine kleine Firma, die
  Schallabsorber herstellt (ADR-038 bis 042). KI anbieteroffen, lokale
  Modelle und Selbstbetrieb von Anfang an (ADR-037). Testprojekt mit wenig menschlicher Zeit: Changes klein
  schneiden, damit Agenten sie unbeaufsichtigt umsetzen können.
  Architekturentscheidungen stehen in docs/adr/ (README.md ist der Index). Sie sind verbindlich.
  Ein Change ist ein Arbeitspaket aus docs/konzept.md (Abschnitt Arbeitspakete); Change-ID: ap-xx-kurzname.
  Abnahmetests sind pytest-Tests unter tests/acceptance/<change-id>/ und dürfen cargo, mix und npm aufrufen.

rules:
  proposal:
    - Unter Impact die betroffenen ADRs mit Nummer nennen; widerspricht der Change einem ADR, das explizit sagen
    - Unter Impact das Gate (G1–G4) und den Pfad der Abnahmetests tests/acceptance/<change-id>/ nennen
    - Nicht-Ziele nennen, besonders Themen aus späteren Meilensteinen (ADR-059)
  specs:
    - Jedes Requirement braucht mindestens ein messbares Scenario (Zahl, Toleranz, Zeit oder Ja/Nein)
    - Jedes Scenario ist [auto] (automatisch prüfbar, wird Abnahmetest) oder [mensch] (Augenschein, Nutzertest, Firmenurteil; wird Punkt der PR-Checkliste „Menschliche Abnahme“); ohne Kennzeichnung gilt [auto]
    - Meldet der Change Messwerte, muss der Test sie selbst nachmessen oder nachrechnen können (Befehl im Design nennen)
    - Braucht ein Scenario einen Testkorpus oder Referenzdaten (Identitätsfälle, Konfliktfälle, Kataloge), liefert sie das Kernteam unter tests/golden/<change-id>/, bevor Abnahmetests geschrieben werden; im Proposal unter Impact nennen
  design:
    - Performance-Budgets und Toleranzen als Zahlen angeben
  tasks:
    - Jede Aufgabe passt in eine Agenten-Sitzung (höchstens ca. 2 Stunden); der ganze Change in höchstens etwa drei Nächte
    - Jede Aufgabe nennt den Test oder Befehl, der sie belegt

operations:
  apply:
    guidance:
      - Arbeite auf dem Branch change/<change-id>; Abnahmetests unter tests/acceptance/<change-id>/ sind der Vertrag und werden nicht geändert
      - Testausgaben knapp halten (pytest -q -x, cargo test -q, mix test --failed); nur fehlschlagende Tests im Detail lesen
      - Nach drei erfolglosen Anläufen am selben Problem anhalten und im PR unter Offene Fragen beschreiben
  archive:
    guidance:
      - Archivieren nur durch das Kernteam nach Abnahme des Gates
