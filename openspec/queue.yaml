# Warteschlange freigegebener Changes – nur das Kernteam ändert diese Datei.
# Reihenfolge nach Meilensteinen (ADR-059): M0 Klären → M1 Erstes Angebot → M2 Zusammen → M3 Beta.
# Ein Eintrag hier ist die Freigabe. Die Nachtschicht nimmt den ersten Eintrag, dessen nächster Schritt offen ist.
#
# phase ist nur noch eine Untergrenze: tools/next_step.py leitet den Zustand aus dem Repo ab
#          (Tests auf main → Umsetzung; alle Tasks abgehakt → fertig). Umstellen von Hand ist nicht nötig.
# phase:   tests   → Abnahmetests fehlen noch (Branch tests/<id>)
#          build   → Tests sind gemergt, Umsetzung steht an (Branch change/<id>)
#          review  → PR offen, wartet auf Kernteam
#          done    → gemergt, wartet auf Archivierung
# model:   sonnet (Standard, sparsam) | opus (Spikes und schwierige Fälle)
# night:   true = darf unbeaufsichtigt bearbeitet werden

changes:
  - id: ap-00-setup
    phase: build
    model: sonnet
    night: true    # reine Einrichtung, durch Abnahmetests vollständig prüfbar
    depends_on: []

  - id: ap-01-spike-datenmodell
    phase: build
    model: opus    # Agent kern-specialist
    night: true    # Testfeld für autonomes Arbeiten; Bewertung des Ergebnisses durch das Kernteam im PR
    depends_on: []

  - id: ap-02-akustik-nachhallzeit
    phase: build
    model: sonnet
    night: true    # klar spezifiziert, durch Abnahmetests vollständig prüfbar
    depends_on: []
