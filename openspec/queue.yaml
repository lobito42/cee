# Warteschlange freigegebener Changes – nur das Kernteam ändert diese Datei.
# Reihenfolge nach Meilensteinen (ADR-059, ADR-062): M0 Klären → M1 Modellieren → M2 Zusammen → M3 Beta.
# Ein Eintrag hier ist die Freigabe. Die Nachtschicht nimmt den ersten Eintrag, dessen nächster Schritt offen ist.
#
# phase ist nur noch eine Untergrenze: tools/next_step.py leitet den Zustand aus dem Repo ab
#          (Tests auf main → Umsetzung; alle Tasks abgehakt → fertig). Umstellen von Hand ist nicht nötig.
# phase:   tests   → Abnahmetests fehlen noch (Branch tests/<id>)
#          build   → Tests sind gemergt, Umsetzung steht an (Branch change/<id>)
#          review  → PR offen, wartet auf Kernteam
#          done    → gemergt, wartet auf Archivierung
# model:   sonnet (Standard, sparsam) | opus (Spikes und schwierige Fälle)
# night:   true = darf unbeaufsichtigt bearbeitet werden

changes:
  - id: ap-00-setup
    phase: build
    model: sonnet
    night: true    # reine Einrichtung, durch Abnahmetests vollständig prüfbar
    depends_on: []

  - id: ap-01-spike-datenmodell
    phase: build
    model: opus    # Agent kern-specialist
    night: true    # Testfeld für autonomes Arbeiten; Bewertung des Ergebnisses durch das Kernteam im PR
    depends_on: []

  - id: ap-02-akustik-nachhallzeit
    phase: build
    model: sonnet
    night: false   # zurückgestellt (Kernteam, 2026-10-19): CAD zuerst, Akustik ist angeschlossenes Fachpaket
    depends_on: []

  - id: ap-03-spike-sync
    phase: tests
    model: opus    # Spike; Agent kern-specialist
    night: true    # Kernaussagen automatisch prüfbar; zwei Browser-Scenarios als menschliche Abnahme im PR
    depends_on: [ap-01-spike-datenmodell]

  - id: ap-05a-schema-einheiten
    phase: tests
    model: sonnet  # Agent kern-specialist bei Schwierigkeiten
    night: true    # vollständig automatisch prüfbar
    depends_on: [ap-01-spike-datenmodell]

  - id: ap-05b-abhaengigkeiten
    phase: tests
    model: sonnet
    night: true    # vollständig automatisch prüfbar
    depends_on: [ap-05a-schema-einheiten]

  - id: ap-41b-ux-bedienkonzept
    phase: tests
    model: sonnet
    night: true    # freigegeben 2026-10-23 (Kernteam): Spec „Interaktions-Grundlagen“ und Tests sind auf main; sieben [mensch]-Scenarios nach dem Bau. Ersetzt ap-41 (No-Go im Pilot TP1)
    depends_on: []

  - id: ap-49-spike-auswahl
    phase: tests
    model: opus    # Agent geometry-specialist (Auswahl nach Regel, stabile Adressen)
    night: true    # Kernaussagen automatisch prüfbar; zwei [mensch]-Scenarios (Einordnung, Empfehlung) im PR
    depends_on: []

  - id: ap-40-bindungen-sdk
    phase: tests
    model: opus    # Agent kern-specialist (Rustler, WASM, PyO3)
    night: true    # vollständig automatisch prüfbar
    depends_on: [ap-05b-abhaengigkeiten]
