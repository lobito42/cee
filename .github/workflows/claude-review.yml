name: Claude Review

# Review läuft nur auf Anforderung (Label "review"), damit das Pro-Abo nicht bei jedem Push belastet wird.
# Authentifizierung über das Claude-Abo: lokal `claude setup-token` ausführen und das Token als
# Repository-Secret CLAUDE_CODE_OAUTH_TOKEN hinterlegen. Kein API-Key, keine Zusatzkosten.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.label.name == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/review-change ${{ github.event.pull_request.number }}"
          claude_args: |
            --model sonnet
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr comment *),Bash(python3 tools/guard.py *),Bash(openspec *),Bash(git diff *),Bash(git log *)"
