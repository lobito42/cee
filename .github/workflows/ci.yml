name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: "0"   # keine Telemetrie ohne Zustimmung (ADR-037)

jobs:
  vertrag:
    name: Vertrag und Konfiguration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - name: Vertragsschutz (Branch-Regeln aus tools/guard.py)
        # Ausnahme nur für Kernteam-PRs: Label "vertrag" UND kein Agenten-Branch (spec/, tests/, change/).
        # Agenten-Branches werden immer geprüft, egal welche Labels gesetzt sind.
        if: >-
          github.event_name == 'pull_request' && !(
            contains(github.event.pull_request.labels.*.name, 'vertrag') &&
            !startsWith(github.head_ref, 'spec/') && !startsWith(github.head_ref, 'tests/') &&
            !startsWith(github.head_ref, 'change/') && !startsWith(github.head_ref, 'claude/'))
        # Der Guard kommt aus dem Basis-Stand, damit ein PR seinen eigenen Schutz nicht ändern kann.
        run: |
          git show origin/${{ github.base_ref }}:tools/guard.py > "$RUNNER_TEMP/guard.py"
          python3 "$RUNNER_TEMP/guard.py" range origin/${{ github.base_ref }}
      - name: Werkzeug-Dateien synchron
        run: python3 tools/sync_agents.py --check
      - name: OpenSpec gültig
        run: |
          npm install -g @fission-ai/openspec@1.14.2
          openspec validate --all --no-interactive

  rust:
    name: Rust-Kern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install  # Version und Komponenten aus rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -q --workspace
      - name: Lizenzen (ADR-034)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  elixir:
    name: Elixir-Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions  # gleiche Versionen wie Nachtschicht und Devcontainer
          version-type: strict
      - run: rustup toolchain install  # rust-toolchain.toml; für die Rustler-Anbindung an crates/graph
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - name: Credo und Dialyzer (sobald in ap-00 eingerichtet)
        run: |
          if grep -q ':credo' mix.exs; then mix credo --strict; fi
          if grep -q ':dialyxir' mix.exs; then mix dialyzer; fi
      - run: mix test

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra cad
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q tests/unit

  abnahme:
    name: Fällige Abnahmetests
    runs-on: ubuntu-latest
    needs: [rust, elixir, python]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: rustup toolchain install  # rust-toolchain.toml
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions  # gleiche Versionen wie Nachtschicht und Devcontainer
          version-type: strict
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: uv sync --extra cad
      - name: Abhängigkeiten von Server und Client (sobald vorhanden)
        shell: bash
        run: |
          if [ -f server/mix.exs ]; then (cd server && mix local.hex --force && mix local.rebar --force && mix deps.get); fi
          if [ -f client/package.json ]; then (cd client && npm install --no-audit --no-fund); fi
      - shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"  # keine Plugins über neue Abhängigkeiten einschleusen
        run: |
          sel=tools/acceptance_targets.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q --depth=1 origin ${{ github.base_ref }}
            git show origin/${{ github.base_ref }}:tools/acceptance_targets.py > "$RUNNER_TEMP/targets.py"
            sel="$RUNNER_TEMP/targets.py"
          fi
          targets=$(CEE_ROOT="$PWD" uv run python "$sel")
          echo "Abnahmetests: ${targets:-keine}"
          if [ -n "$targets" ]; then uv run pytest -q $targets; fi
          # Auf tests/<id>: neue Abnahmetests sind absichtlich rot – nur prüfen, dass sie sich sammeln lassen.
          head="${{ github.head_ref }}"
          if [[ "$head" =~ ^(claude/)?tests/([a-z0-9][a-z0-9-]*)$ ]]; then
            own="tests/acceptance/${BASH_REMATCH[2]}"
            if [ -d "$own" ]; then uv run pytest -q --collect-only "$own"; fi
          fi

  client:
    name: Client (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - run: npm install
      - run: npm run lint
      - run: npm test

  desktop:
    name: Desktop-App (Tauri, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Desktop-Gerüst vorhanden?
        id: probe
        shell: bash
        run: if [ -f client/src-tauri/tauri.conf.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.probe.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - if: steps.probe.outputs.present == 'true'
        shell: bash
        run: rustup toolchain install  # rust-toolchain.toml
      - if: steps.probe.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - if: steps.probe.outputs.present == 'true'
        working-directory: client
        shell: bash
        run: |
          npm install
          npx --yes @tauri-apps/cli@2 build --no-bundle
