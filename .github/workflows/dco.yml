name: DCO

# Prüft "Signed-off-by" in jedem Commit eines Pull Requests (CONTRIBUTING.md, ADR-034).
# Kernteam- und Agenten-Commits aus der Nachtschicht signieren ebenfalls.

on:
  pull_request:

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Signed-off-by in allen Commits
        shell: bash
        run: |
          missing=0
          for c in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Ohne Signed-off-by: $(git log -1 --format='%h %s' "$c")"; missing=1
            fi
          done
          exit $missing
