name: Nachtschicht

# Unbeaufsichtigter Lauf (Skill /nachtschicht) auf einem GitHub-Runner: gleiche Werkzeugkette wie die CI,
# freier Netzzugang für Paketregistries (hex.pm, crates.io, static.rust-lang.org), kein Cloud-Allowlist-Problem.
#
# Einschalten: Repository-Variable NACHTSCHICHT=an (Settings → Secrets and variables → Actions → Variables).
# Voraussetzungen: Secret CLAUDE_CODE_OAUTH_TOKEN (Abo, `claude setup-token`) und die Claude-GitHub-App für
# dieses Repository – nur mit ihr lösen Pushes und PRs des Agenten die CI aus.
# Kontingent: Ist nichts zu tun, startet Claude gar nicht (tools/next_step.py entscheidet ohne KI).

on:
  schedule:
    - cron: "7 23 * * 0-4"   # So–Do 23:07 UTC = werktags 01:07 Sommerzeit bzw. 00:07 Winterzeit
  workflow_dispatch:

concurrency:
  group: nachtschicht
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read
  id-token: write

jobs:
  schicht:
    if: vars.NACHTSCHICHT == 'an'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CEE_STRICT: "1"
      GH_TOKEN: ${{ github.token }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protokoll-Issue finden oder anlegen
        id: issue
        shell: bash
        run: |
          gh label create nachtschicht --color 5319e7 --description "Protokoll der Nachtschicht" 2>/dev/null || true
          for l in blocked fix-1 fix-2; do gh label create "$l" --color b60205 2>/dev/null || true; done
          nr=$(gh issue list --label nachtschicht --state open --json number --jq '.[0].number')
          if [ -z "$nr" ]; then
            nr=$(gh issue create --title "Nachtschicht-Protokoll" --label nachtschicht \
              --body "Jeder Lauf der Nachtschicht schreibt hier einen Kommentar." | grep -o '[0-9]*$')
          fi
          echo "nr=$nr" >> "$GITHUB_OUTPUT"

      - name: Nächster Schritt (ohne KI)
        id: next
        shell: bash
        run: |
          out=$(python3 tools/next_step.py)
          echo "$out"
          echo "json=$out" >> "$GITHUB_OUTPUT"
          echo "step=$(jq -r .step <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "model=$(jq -r '.model // "sonnet"' <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Nichts zu tun oder Halt – nur protokollieren
        if: steps.next.outputs.step == 'stop'
        shell: bash
        env:
          NEXT: ${{ steps.next.outputs.json }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason=$(jq -r .reason <<<"$NEXT")
          label=$(jq -r '.label // empty' <<<"$NEXT"); pr=$(jq -r '.pr // empty' <<<"$NEXT")
          if [ -n "$label" ] && [ -n "$pr" ]; then gh pr edit "$pr" --add-label "$label"; fi
          gh issue comment ${{ steps.issue.outputs.nr }} --body "$(date -u +%F) · gestoppt: ${reason} · [Lauf]($RUN)"

      # Ab hier nur, wenn es etwas zu tun gibt
      - if: steps.next.outputs.step != 'stop'
        uses: astral-sh/setup-uv@v6
      - if: steps.next.outputs.step != 'stop'
        run: rustup toolchain install  # rust-toolchain.toml
      - if: steps.next.outputs.step != 'stop'
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - if: steps.next.outputs.step != 'stop'
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - if: steps.next.outputs.step != 'stop'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - if: steps.next.outputs.step != 'stop'
        name: Werkzeuge
        run: |
          uv sync --extra cad
          npm install -g @fission-ai/openspec@1.14.2
          git config core.hooksPath .githooks
          if [ -f server/mix.exs ]; then (cd server && mix local.hex --force && mix local.rebar --force && mix deps.get); fi

      # Die Action wendet permissions.allow/deny aus .claude/settings.json nicht an (Probelauf 2026-10-18:
      # erlaubte Befehle wie `git pull` wurden verweigert). Deshalb dieselben Listen als Parameter übergeben.
      - if: steps.next.outputs.step != 'stop'
        name: Rechte aus .claude/settings.json
        id: perm
        shell: bash
        run: |
          # Edit/Write zusätzlich: Welche Pfade erlaubt sind, entscheidet der Vertragsschutz (PreToolUse-Hook).
          echo "allow=Edit,Write,$(jq -r '.permissions.allow | join(",")' .claude/settings.json)" >> "$GITHUB_OUTPUT"
          echo "deny=$(jq -r '.permissions.deny | join(",")' .claude/settings.json)" >> "$GITHUB_OUTPUT"
          echo "kommentare=$(gh issue view ${{ steps.issue.outputs.nr }} --json comments --jq '.comments | length')" >> "$GITHUB_OUTPUT"

      - if: steps.next.outputs.step != 'stop'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Führe den Skill /nachtschicht aus. Der Schrittplaner hat bereits entschieden:
            ${{ steps.next.outputs.json }}
            Protokoll-Issue: #${{ steps.issue.outputs.nr }}. Halte dich strikt an die Grenzen des Skills.
          claude_args: |
            --model ${{ steps.next.outputs.model }}
            --max-turns 200
            --allowedTools "${{ steps.perm.outputs.allow }}"
            --disallowedTools "${{ steps.perm.outputs.deny }}"

      # Ohne Protokolleintrag hat Claude nicht ordentlich gearbeitet (z. B. Rechte verweigert) – sichtbar machen.
      - if: steps.next.outputs.step != 'stop'
        name: Protokolleintrag prüfen
        id: pruef
        shell: bash
        env:
          NEXT: ${{ steps.next.outputs.json }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jetzt=$(gh issue view ${{ steps.issue.outputs.nr }} --json comments --jq '.comments | length')
          if [ "$jetzt" -le "${{ steps.perm.outputs.kommentare }}" ]; then
            gh issue comment ${{ steps.issue.outputs.nr }} --body "$(date -u +%F) · \`$NEXT\` · **ohne \
          Protokolleintrag beendet** (Rechte verweigert oder vorzeitig aufgegeben) · [Lauf]($RUN)"
            exit 1
          fi

      # Sicherheitsnetz: Commits auf einem Agenten-Branch, die Claude nicht pushen konnte, gingen mit dem Runner
      # verloren (Probelauf 2026-10-18). Nur Commits, keine ungesicherten Änderungen; nie main.
      # Push mit GITHUB_TOKEN löst keine CI aus – die läuft beim nächsten Push des Agenten.
      - if: always() && steps.next.outputs.step != 'stop'
        name: Commits sichern
        shell: bash
        env:
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          b=$(git branch --show-current)
          case "$b" in spec/*|tests/*|change/*) ;; *) exit 0 ;; esac
          [ -z "$(git status --porcelain)" ] || echo "::warning::Nicht committete Änderungen auf $b gehen verloren"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$remote" "$b" >/dev/null; then
            git fetch -q "$remote" "$b"
            [ -n "$(git rev-list FETCH_HEAD..HEAD)" ] || exit 0
          fi
          git push "$remote" "HEAD:refs/heads/$b"
          gh issue comment ${{ steps.issue.outputs.nr }} --body "$(date -u +%F) · \`$b\` · Commits nach dem \
          Lauf automatisch gesichert (Claude konnte nicht pushen) · [Lauf]($RUN)"

      - name: Abbruch protokollieren
        if: (failure() || cancelled()) && steps.pruef.outcome != 'failure'
        shell: bash
        env:
          NEXT: ${{ steps.next.outputs.json }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment ${{ steps.issue.outputs.nr }} --body "$(date -u +%F) · \`$NEXT\` · **abgebrochen** \
          (Zeitlimit, Kontingent oder Fehler) · [Lauf]($RUN) · Die nächste Nacht setzt auf dem Branch fort."
