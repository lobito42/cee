      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: {{c.warnungFlaeche}}; color: {{c.warnungText}}; font-weight: 500;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6l3 2"></path></svg>In Prüfung</span>

      <button style="margin-left: auto; height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid {{c.linieStark}}; background: {{c.flaeche}}; color: {{c.text}};">Kommentieren</button>
      <button style="height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: {{c.akzent}}; color: {{c.aufAkzent}}; font-weight: 500;">Freigeben</button>
